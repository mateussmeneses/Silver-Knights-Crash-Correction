//============================================================
//	テストマップ用設定ファイル	2008/04/28 更新版
//============================================================

//------------------------------------------------------------
//	マップ情報
[INFO]
// クリッピング距離	物体が描画される最長距離。スカイドームの半径にも使用
CLIP_PLANE_FAR=540
// フォグ開始距離	0未満で未使用	※色は背景色と同一
FOG_START=530
// フォグ終了距離	0未満で未使用	※色は背景色と同一
FOG_END=540
// 移動可能な横サイズ	半分の距離を指定
WORLD_WIDTH=100
// 移動可能な縦サイズ	半分の距離を指定
WORLD_HEIGHT=80
// 背景色		色の3原色（赤・緑・青）を指定
BACK_COLOR_R=12
BACK_COLOR_G=12
BACK_COLOR_B=20

//------------------------------------------------------------
//	BSPファイル関連
[BSP]
// BSPファイル名	｢.bsp｣ を含む
BSP_NAME=heli.bsp
// WADファイル名	｢.wad｣ を含む
WAD_NAME=heli.wad
// BSPスケール		ハンマーエディタ内のスケールをSK用に変換
BSP_SCALE=0.18
// ガンマ値		ライトマップの明るさ（0未満:ライトマップ未使用）
LIGHT_MAP_GAMMA=0.8
// ライト有効距離	光の有効距離（半径）
LIGHT_LENGTH=80
// 衝突面のアルファ値	カメラが物体内部に入った場合の面のアルファ値（0～255）
CAMERA_ALPHA=128

//------------------------------------------------------------
//	空関連
[SKY]
// 空区分		0で未使用。SKY01～XX.BMPに対応
SKY_KIND=15
// 空回転量(度)		テクスチャの太陽位置をマップに合わせるために使用（-360～360）
SKY_ROT_Y=180

//------------------------------------------------------------
//	床関連
[FLOOR]
// 床面数		半分の個数を指定（0:未使用）
FLOOR_NUM=4
// 床１つのサイズ
FLOOR_SIZE=100
// 繰り返し回数		床１つに対するテクスチャの繰り返し回数
FLOOR_REPET=1
// 床のY座標
FLOOR_Y=28
// 床のテクスチャ名	
FLOOR_TEX_NAME=exp.bmp
//============================================================
//
//	Wally用テクスチャメモ
//		sky			空。平行光源light_environmentを用いる場合は必須。
//		-（ファイル名の先頭）	描画あり・衝突判定無し
//		!			水用らしい。黒で透過。只今実装中…。(^^;
//
