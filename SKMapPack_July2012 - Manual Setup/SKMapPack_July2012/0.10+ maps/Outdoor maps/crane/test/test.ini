//============================================================
//　　　　テストマップ用設定ファイル　　　　2010/03/29 更新版
//============================================================

//------------------------------------------------------------
//　　　　マップ情報
//
[INFO]
// クリッピング距離　　　　物体が描画される最長距離。スカイドームの半径にも使用。
//　　　　　　　　　　　　【Ver0.12C以降なるべくマップをコンパクトに出来るように、スカイドームより先は表示されない】
CLIP_PLANE_FAR=350
// フォグ開始距離　　　　0未満で未使用　　　　※色は背景色と同じ
FOG_START=100
// フォグ終了距離　　　　0未満で未使用　　　　※色は背景色と同じ
FOG_END=280
// 移動可能な横サイズ　　　　半分の距離を指定
WORLD_WIDTH=32
// 移動可能な縦サイズ　　　　半分の距離を指定
WORLD_HEIGHT=200
// 背景色　　　　　　　　色の3原色（赤・緑・青）を指定
BACK_COLOR_R=128
BACK_COLOR_G=128
BACK_COLOR_B=100
// HDR光度　　　　　　　　光るテクスチャの強度。ＨＤＲ時のみ適用される
HDR_POWER=8.0

//------------------------------------------------------------
//　　　　BSPファイル関連
//
[BSP]
// BSPファイル名　　　　｢.bsp｣ を含む
BSP_NAME=crane.bsp
// WADファイル名　　　　｢.wad｣ を含む
WAD_NAME=crane.wad
// BSPスケール　　　　　　　　ハンマーエディタ内のスケールをＳＫ用に変換
BSP_SCALE=0.1
// ライトマップガンマ　　　　ライトマップの明るさ（0未満:ライトマップ未使用）
//　　　　　　　　　　　　【Ｔ２等で作成し、既に影があるテクスチャには不要なので0未満を設定すること】
LIGHT_MAP_GAMMA=1
// ディフューズガンマ　　　　元テクスチャの明るさ（0.0～2.0ぐらいの範囲）
DIFFUSE_GAMMA=1.0
// ライト有効距離　　　　光の有効距離（半径）　　　　※環境光（Environment Light）は無限光源なのでこの値は無視される
LIGHT_LENGTH=500
// 半透明のアルファ値　　　　半透明テクスチャを使用した場合のアルファ値（0～255）
//　　　　　　　　　　　　※カメラが物体内部に入った場合の面のアルファ値は128固定。
CAMERA_ALPHA=200
// 光源スケール　　　　　　　　光源位置（スポットライトのみ）に光のテクスチャを表示（0未満で未使用）
LIGHT_SCALE=-1
// 光源位置調整　　　　　　　　上記の位置調整用。ＸＹＺ指定。
LIGHT_ADJUST_X=0
LIGHT_ADJUST_Y=0
LIGHT_ADJUST_Z=0

//------------------------------------------------------------
//　　　　空関連
//
[SKY]
// 空区分　　　　　　　　0で未使用。SKY01～XX.BMPに対応
SKY_KIND=1
// 空回転量(度)　　　　　　　　テクスチャの太陽位置をマップに合わせるために使用（-360～360）
SKY_ROT_Y=0
// HDR光度　　　　　　　　スカイドームのＨＤＲ強度。ＨＤＲ時のみ適用される（0未満で未使用）
SKY_HDR_POWER=7

//------------------------------------------------------------
//　　　　水面関連
[WATER]
// 水使用フラグ　　　　　　　　0:未使用 / 1:使用
USE=0
// 水面アルファ値　　　　水面の半透明度（0.0～1.0）
WATER_ALPHA=0.5
// 波の進行方向・速度　　　　±0.002ぐらいが標準値
WAVE_SPEED_X=0.0
WAVE_SPEED_Z=-0.005
// 水面の色　　　　　　　　（0.0～2.0ぐらいの範囲で指定）
WATER_DIFFUSE_R=0.6
WATER_DIFFUSE_G=0.6
WATER_DIFFUSE_B=1.0
// 光の反射時の色　　　　太陽光で赤くする等のエフェクト用（0.0～2.0ぐらいの範囲で指定）
WATER_SPECULAR_R=1.2
WATER_SPECULAR_G=1.2
WATER_SPECULAR_B=1.2
// 光の反射時の強度　　　　上記の強度。高いほど弱くなる（0.0～16.0ぐらいの範囲で指定）
SPECULAR_POWER=14.0
// 水面の数　　　　　　　　最大５個まで。大きな水面は負荷が高いのでなるべく１個の方が良い
WATER_NUM=0
// 水面の位置　　　　　　　　最大５個まで。中心位置を指定する
POS1_X=0.0
POS1_Y=0.0
POS1_Z=0.0
POS2_X=60.0
POS2_Y=30.0
POS2_Z=20.0
POS3_X=0.0
POS3_Y=0.0
POS3_Z=0.0
POS4_X=0.0
POS4_Y=0.0
POS4_Z=0.0
POS5_X=0.0
POS5_Y=0.0
POS5_Z=0.0
// 水面のスケール　　　　最大５個まで。
//　　　　　　　　　　　　※ＳＫをポーズ（Ｐキー）して移動し、水面端位置でTABキーを押してカメラ座標を確認し、調整する。超面倒…。(^^;
SCALE1_X=150.0
SCALE1_Y=10.0
SCALE1_Z=150.0
SCALE2_X=30.0
SCALE2_Y=60.0
SCALE2_Z=30.0
SCALE3_X=0.0
SCALE3_Y=0.0
SCALE3_Z=0.0
SCALE4_X=0.0
SCALE4_Y=0.0
SCALE4_Z=0.0
SCALE5_X=0.0
SCALE5_Y=0.0
SCALE5_Z=0.0

//------------------------------------------------------------
// ■色々メモ
//
// ▼テクスチャ
//　　　　sky　　　　　　　　　　　　　　　　空。平行光源light_environmentを用いる場合は必須。
//　　　　-（ファイル名の先頭）　　　　　　　　描画あり・衝突判定無しとなる
//　　　　{（ファイル名の先頭）　　　　　　　　透過テクスチャ用（黒で透過）。木テクスチャ等に使用
//　　　　!（ファイル名の先頭）　　　　　　　　半透明用。
//　　　　!00（先頭から3Byte）　　　　　　　　半透明アニメ。半透明のアルファ値（CAMERA_ALPHA）=255で無透過
//　　　　}（ファイル名の2or4Byte目）　　　　ＨＤＲ対象テクスチャとなる。（ある程度明るくなければならない）
//
// ▼環境光（Environment Light）について
// ・ハンマーエディタで設定したヨー・ピッチがライトベクトル（光源の方向）となる。
// ・機体の明るさは、機体からライトベクトルに障害物判定を行い、ヒットすれば光無し（光が遮断されている）、ヒットすれば光有り（光が届いている）となる。
// ・光の強度は一定。常にハンマーエディタの色で設定した値となる。
// 
// ▼スポットライト
// ・機体から１番近いスポットライトを見つけ、機体～スポットライト間の障害物判定を行い、ヒットしたｋじゃ否かで機体の明るさが決まる。
// ・光の強度は距離に応じて変化。⇒これがライト有効距離（LIGHT_LENGTH）となる。
//
// ▼ハンマーエディタでは穴は無く、ＳＫで穴が空いてたら…
// 【原因】ハンマーエディタはコンパイル中に結合できる面を見つけたら勝手に結合する。この結合にバグがあるみたい…
// 【対策】穴が空いている面のどこかの頂点をわざとずらす。この時隣接する面の対応する頂点も変えねばならない。
//　　　　　 又、コンパイルする前に出力されるＢＳＰファイルを必ず削除すること！
//　　　　　 上書きした場合は変更点が適用されない。
//
