//============================================================
//	テストマップ用設定ファイル	2008/04/28 更新版
//============================================================

//------------------------------------------------------------
//	マップ情報
[INFO]
// クリッピング距離	物体が描画される最長距離。スカイドームの半径にも使用
CLIP_PLANE_FAR=180
// フォグ開始距離	0未満で未使用	※色は背景色と同一
FOG_START=30
// フォグ終了距離	0未満で未使用	※色は背景色と同一
FOG_END=180
// 移動可能な横サイズ	半分の距離を指定
WORLD_WIDTH=80
// 移動可能な縦サイズ	半分の距離を指定
WORLD_HEIGHT=80
// 背景色		色の3原色（赤・緑・青）を指定
BACK_COLOR_R=240
BACK_COLOR_G=240
BACK_COLOR_B=240

//------------------------------------------------------------
//	BSPファイル関連
[BSP]
// BSPファイル名	｢.bsp｣ を含む
BSP_NAME=kaitei.bsp
// WADファイル名	｢.wad｣ を含む
WAD_NAME=kaitei.wad
// BSPスケール		ハンマーエディタ内のスケールをSK用に変換
BSP_SCALE=0.30
// ガンマ値		ライトマップの明るさ（0未満:ライトマップ未使用）
LIGHT_MAP_GAMMA=0.7
// ライト有効距離	光の有効距離（半径）
LIGHT_LENGTH=280
// 衝突面のアルファ値	カメラが物体内部に入った場合の面のアルファ値（0～255）
CAMERA_ALPHA=128

//------------------------------------------------------------
//	空関連
[SKY]
// 空区分		0で未使用。SKY01～XX.BMPに対応
SKY_KIND=2
// 空回転量(度)		テクスチャの太陽位置をマップに合わせるために使用（-360～360）
SKY_ROT_Y=275

[WATER]
#水使用フラグ(0:未使用/1:使用)
USE=1
# 水位置(Y)
POS_Y=20.0
