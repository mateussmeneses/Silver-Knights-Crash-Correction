//============================================================
//	テストマップ用設定ファイル	2008/04/28 更新版
//============================================================

//------------------------------------------------------------
//	マップ情報
[INFO]
// クリッピング距離	物体が描画される最長距離。スカイドームの半径にも使用
CLIP_PLANE_FAR=400
// フォグ開始距離	0未満で未使用	※色は背景色と同一
FOG_START=0
// フォグ終了距離	0未満で未使用	※色は背景色と同一
FOG_END=0
// 移動可能な横サイズ	半分の距離を指定
WORLD_WIDTH=130
// 移動可能な縦サイズ	半分の距離を指定
WORLD_HEIGHT=55
// 背景色		色の3原色（赤・緑・青）を指定
BACK_COLOR_R=240
BACK_COLOR_G=240
BACK_COLOR_B=255

//------------------------------------------------------------
//	BSPファイル関連
[BSP]
// BSPファイル名	｢.bsp｣ を含む
BSP_NAME=racemap.bsp
// WADファイル名	｢.wad｣ を含む
WAD_NAME=racemap.wad
// BSPスケール		ハンマーエディタ内のスケールをSK用に変換
BSP_SCALE=0.10
// ガンマ値		ライトマップの明るさ（0未満:ライトマップ未使用）
LIGHT_MAP_GAMMA=1.0
// ライト有効距離	光の有効距離（半径）
LIGHT_LENGTH=1000
// 衝突面のアルファ値	カメラが物体内部に入った場合の面のアルファ値（0～255）
CAMERA_ALPHA=128

//------------------------------------------------------------
//	空関連
[SKY]
// 空区分		0で未使用。SKY01～XX.BMPに対応
SKY_KIND=07
// 空回転量(度)		テクスチャの太陽位置をマップに合わせるために使用（-360～360）
SKY_ROT_Y=180

//------------------------------------------------------------
//	床関連
[FLOOR]
// 床面数		半分の個数を指定（0:未使用）
FLOOR_NUM=0
// 床１つのサイズ
FLOOR_SIZE=100
// 繰り返し回数		床１つに対するテクスチャの繰り返し回数
FLOOR_REPET=1
// 床のY座標
FLOOR_Y=0
// 床のテクスチャ名	
FLOOR_TEX_NAME=sand.bmp


//------------------------------------------------------------
//	水面関連
[WATER]
// 水使用フラグ		0:未使用 / 1:使用
USE=1
// 水面アルファ値	水面の半透明度（0.0～1.0）
WATER_ALPHA=0.5
// 波の進行方向・速度	±0.002ぐらいが標準値
WAVE_SPEED_X=0.0
WAVE_SPEED_Z=0.002
// 水面の色		（0.0～2.0ぐらいの範囲で指定）
WATER_DIFFUSE_R=0.6
WATER_DIFFUSE_G=0.6
WATER_DIFFUSE_B=0.9
// 光の反射時の色	太陽光で赤くする等のエフェクト用（0.0～2.0ぐらいの範囲で指定）
WATER_SPECULAR_R=1.2
WATER_SPECULAR_G=1.2
WATER_SPECULAR_B=1.3
// 光の反射時の強度	上記の強度。高いほど弱くなる（0.0～16.0ぐらいの範囲で指定）
SPECULAR_POWER=16.0
// 水面の数		最大５個まで。大きな水面は負荷が高いのでなるべく１個の方が良い
WATER_NUM=1
// 水面の位置		最大５個まで。中心位置を指定する
POS1_X=0.0
POS1_Y=-6.0
POS1_Z=0.0
POS2_X=0.0
POS2_Y=0.0
POS2_Z=0.0
POS3_X=0.0
POS3_Y=0.0
POS3_Z=0.0
POS4_X=0.0
POS4_Y=0.0
POS4_Z=0.0
POS5_X=0.0
POS5_Y=0.0
POS5_Z=0.0
// 水面のスケール	最大５個まで。
//			※ＳＫをポーズ（Ｐキー）して移動し、水面端位置でTABキーを押してカメラ座標を確認し、調整する。超面倒…。(^^;
SCALE1_X=350.0
SCALE1_Y=1.4
SCALE1_Z=350.0
SCALE2_X=0.0
SCALE2_Y=0.0
SCALE2_Z=0.0
SCALE3_X=0.0
SCALE3_Y=0.0
SCALE3_Z=0.0
SCALE4_X=0.0
SCALE4_Y=0.0
SCALE4_Z=0.0
SCALE5_X=0.0
SCALE5_Y=0.0
SCALE5_Z=0.0



