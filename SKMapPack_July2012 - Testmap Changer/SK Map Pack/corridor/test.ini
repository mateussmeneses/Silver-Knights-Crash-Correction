//------------------------------------------------------------
//	マップ情報
[INFO]
// クリッピング距離	物体が描画される最長距離。スカイドームの半径にも使用
CLIP_PLANE_FAR=200
// フォグ開始距離	0未満で未使用	※色は背景色と同一
FOG_START=65
// フォグ終了距離	0未満で未使用	※色は背景色と同一
FOG_END=170
// 移動可能な横サイズ	半分の距離を指定
WORLD_WIDTH=100
// 移動可能な縦サイズ	半分の距離を指定
WORLD_HEIGHT=90
// 背景色		色の3原色（赤・緑・青）を指定
BACK_COLOR_R=255
BACK_COLOR_G=255
BACK_COLOR_B=250
// HDR光度　低い程高い（範囲：0.0～10.0ぐらい、初期値3.0）
HDR_POWER=3.0


//------------------------------------------------------------
//	BSPファイル関連
[BSP]
// BSPファイル名	｢.bsp｣ を含む
BSP_NAME=kairou3.bsp
// WADファイル名	｢.wad｣ を含む
WAD_NAME=kairou.wad
// BSPスケール		ハンマーエディタ内のスケールをSK用に変換
BSP_SCALE=0.05
// ガンマ値		ライトマップの明るさ（0未満:ライトマップ未使用）
LIGHT_MAP_GAMMA=1.6
// ライト有効距離	光の有効距離（半径）
LIGHT_LENGTH=800
// 衝突面のアルファ値	カメラが物体内部に入った場合の面のアルファ値（0～255）
CAMERA_ALPHA=60

//------------------------------------------------------------
//	空関連
[SKY]
// 空区分		0で未使用。SKY01～XX.BMPに対応
SKY_KIND=0
// 空回転量(度)		テクスチャの太陽位置をマップに合わせるために使用（-360～360）
SKY_ROT_Y=275

//------------------------------------------------------------
//	水面関連
[WATER]
// 水使用フラグ		0:未使用 / 1:使用
USE=1
// 水面アルファ値	水面の半透明度（0.0～1.0）
WATER_ALPHA=0.5
// 波の進行方向・速度	±0.002ぐらいが標準値
WAVE_SPEED_X=0.0
WAVE_SPEED_Z=0.002
// 水面の色		（0.0～2.0ぐらいの範囲で指定）
WATER_DIFFUSE_R=0.6
WATER_DIFFUSE_G=0.6
WATER_DIFFUSE_B=1.0
// 光の反射時の色	太陽光で赤くする等のエフェクト用（0.0～2.0ぐらいの範囲で指定）
WATER_SPECULAR_R=1.3
WATER_SPECULAR_G=1.2
WATER_SPECULAR_B=1.2
// 光の反射時の強度	上記の強度。高いほど弱くなる（0.0～16.0ぐらいの範囲で指定）
SPECULAR_POWER=16.0
// 水面の数		最大５個まで。大きな水面は負荷が高いのでなるべく１個の方が良い
WATER_NUM=1
// 水面の位置		最大５個まで。中心位置を指定する
POS1_X=0.0
POS1_Y=-88.0
POS1_Z=0.0
POS2_X=0.0
POS2_Y=0.0
POS2_Z=0.0
POS3_X=0.0
POS3_Y=0.0
POS3_Z=0.0
POS4_X=0.0
POS4_Y=0.0
POS4_Z=0.0
POS5_X=0.0
POS5_Y=0.0
POS5_Z=0.0
// 水面のスケール	最大５個まで。
//			※ＳＫをポーズ（Ｐキー）して移動し、水面端位置でTABキーを押してカメラ座標を確認し、調整する。超面倒…。(^^;
SCALE1_X=120.0
SCALE1_Y=0.5
SCALE1_Z=120.0
SCALE2_X=0.0
SCALE2_Y=0.0
SCALE2_Z=0.0
SCALE3_X=0.0
SCALE3_Y=0.0
SCALE3_Z=0.0
SCALE4_X=0.0
SCALE4_Y=0.0
SCALE4_Z=0.0
SCALE5_X=0.0
SCALE5_Y=0.0
SCALE5_Z=0.0

//------------------------------------------------------------
// ■色々メモ
//
// ▼テクスチャ
//	sky				空。平行光源light_environmentを用いる場合は必須。
//	-（ファイル名の先頭）		描画あり・衝突判定無しとなる
//	{（ファイル名の先頭）		透過テクスチャ用（黒で透過）。木テクスチャ等に使用
//	!（ファイル名の先頭）		半透明用。
//	!00（先頭から3Byte）		半透明アニメ。半透明のアルファ値（CAMERA_ALPHA）=255で無透過
//	}（ファイル名の2or4Byte目）	ＨＤＲ対象テクスチャとなる。（ある程度明るくなければならない）
//
// ▼環境光（Environment Light）について
// ・ハンマーエディタで設定したヨー・ピッチがライトベクトル（光源の方向）となる。
// ・機体の明るさは、機体からライトベクトルに障害物判定を行い、ヒットすれば光無し（光が遮断されている）、ヒットすれば光有り（光が届いている）となる。
// ・光の強度は一定。常にハンマーエディタの色で設定した値となる。
// 
// ▼スポットライト
// ・機体から１番近いスポットライトを見つけ、機体～スポットライト間の障害物判定を行い、ヒットしたｋじゃ否かで機体の明るさが決まる。
// ・光の強度は距離に応じて変化。⇒これがライト有効距離（LIGHT_LENGTH）となる。
//
// ▼ハンマーエディタでは穴は無く、ＳＫで穴が空いてたら…
// 【原因】ハンマーエディタはコンパイル中に結合できる面を見つけたら勝手に結合する。この結合にバグがあるみたい…
// 【対策】穴が空いている面のどこかの頂点をわざとずらす。この時隣接する面の対応する頂点も変えねばならない。
//	　 又、コンパイルする前に出力されるＢＳＰファイルを必ず削除すること！
//	　 上書きした場合は変更点が適用されない。
//
